# A Color Me Crazy! dedicated server:  docker compose up -d
# The console: docker attach colormecrazy (type help; Ctrl+P then Ctrl+Q leaves it running).
# Forward UDP 7777 on your router to this machine, then give your players its public address. UDP 7778 answers server
# queries (A2S: name, map, painters) for status tools; drop its line if nothing reads it. A second server here needs other
# ports two apart (7779 and 7780, with -QueryPort=7780), never 7778.
services:
  colormecrazy:
    image: dogwaterstudios/colormecrazy:latest
    container_name: colormecrazy
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "7777:7777/udp"
      - "7778:7778/udp"
      # RCON for a hosting panel or an RCON tool: uncomment this, add "-RconBind=0.0.0.0" to command, and set the
      # password with rconpassword in the console (or CMC_RCON_PASSWORD under environment; never -RconPassword=, which
      # the engine writes into the log). It is unencrypted: keep it on the host's loopback (as here) or a private network.
      # - "127.0.0.1:7777:7777/tcp"
    volumes:
      - cmc-saved:/server/ColorMeCrazy/Saved
    # Anything here wins over rules.json at every start. -NoSetup: start without the first-start questions (the console's
    # setup asks them later). -NoUPnP: Docker's NAT keeps UPnP from reaching the router.
    command: ["-NoSetup", "-NoUPnP", "-ServerName=My Studio"]
    # Saving a big gallery can take longer than Docker's default 10 seconds.
    stop_grace_period: 60s

volumes:
  cmc-saved:
